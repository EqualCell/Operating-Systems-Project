name: Build and test xv6 file effects
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check agent CLI argument parser
        run: python3 -m agent --help
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc python3 bc
          command -v qemu-system-riscv64
          qemu-system-riscv64 --version
      - name: Run core and upstream regression tests
        run: ./run_tests.sh --slow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: evidence/run-*/
